# Render Blueprint configuration for Sukhwal Auto Services
services:
  - type: web
    name: sukhwal-auto-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ronaksukhwal5@gmail.com
      - key: SMTP_FROM
        value: ronaksukhwal5@gmail.com
      - key: ADMIN_EMAIL
        value: ronaksukhwal5@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
